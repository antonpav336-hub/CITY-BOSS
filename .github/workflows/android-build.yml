name: Android Export

on:
  workflow_dispatch:
  push:
    branches: [main, development]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android export
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/city-boss-debug.apk

      - name: Verify APK
        run: |
          test -s build/city-boss-debug.apk
          file build/city-boss-debug.apk
          unzip -t build/city-boss-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: city-boss-android-debug
          path: build/city-boss-debug.apk
          if-no-files-found: error
